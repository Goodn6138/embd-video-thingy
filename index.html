<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Watch this video</title>

    <meta
        name="description"
        content="Watch this video online."
    >

    <!-- Open Graph / WhatsApp -->
    <meta property="og:type" content="website">
    <meta
        property="og:title"
        content="Watch this video"
    >
    <meta
        property="og:description"
        content="Tap to watch the video."
    >
    <meta
        property="og:url"
        content="https://embd-video-thingy.vercel.app/"
    >
    <meta
        property="og:site_name"
        content="Embedded Video"
    >

    <!-- IMPORTANT: absolute HTTPS URL -->
    <meta
        property="og:image"
        content="https://embd-video-thingy.vercel.app/preview.jpg"
    >

    <meta
        property="og:image:width"
        content="1200"
    >
    <meta
        property="og:image:height"
        content="630"
    >
    <meta
        property="og:image:type"
        content="image/jpeg"
    >

    <!-- Twitter/X fallback -->
    <meta
        name="twitter:card"
        content="summary_large_image"
    >
    <meta
        name="twitter:title"
        content="Watch this video"
    >
    <meta
        name="twitter:description"
        content="Tap to watch the video."
    >
    <meta
        name="twitter:image"
        content="https://embd-video-thingy.vercel.app/preview.jpg"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            background: #080808;
            color: white;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            display: flex;
            justify-content: center;
            padding: 24px;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            margin: auto;
        }

        h1 {
            font-size: 28px;
            margin: 0 0 20px;
        }

        .video-container {
            width: 100%;
            background: #000;
            border-radius: 14px;
            overflow: hidden;
        }

        video {
            display: block;
            width: 100%;
            height: auto;
            max-height: 80vh;
            background: #000;
        }

        .info {
            margin-top: 18px;
            color: #999;
            font-size: 14px;
            line-height: 1.5;
        }
    </style>
</head>

<body>

<main class="container">

    <h1>Watch this video</h1>

    <div class="video-container">
        <video
            controls
            playsinline
            preload="metadata"
            poster="/preview.jpg"
        >
            <source
                src="/videos/sample.mp4"
                type="video/mp4"
            >

            Your browser does not support video playback.
        </video>
    </div>

    <p class="info">
        Tap play to watch the video.
    </p>

</main>

</body>
</html>
