<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Embedded Video</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            background: #0b0b0f;
            color: #ffffff;
        }

        body {
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 1000px;
        }

        h1 {
            margin: 0 0 24px;
            font-size: 28px;
            line-height: 1.2;
        }

        .video-wrapper {
            width: 100%;
            overflow: hidden;
            border-radius: 16px;
            background: #000;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.45);
        }

        video {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
            background: #000;
        }

        .description {
            margin-top: 16px;
            color: #a1a1aa;
            font-size: 14px;
            line-height: 1.6;
        }

        .status {
            margin-top: 20px;
            padding: 12px 14px;
            border: 1px solid #27272a;
            border-radius: 10px;
            background: #18181b;
            color: #a1a1aa;
            font-size: 13px;
        }

        .status.ok {
            color: #86efac;
        }

        .status.error {
            color: #fca5a5;
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>Embedded Video</h1>

        <div class="video-wrapper">
            <video
                controls
                preload="metadata"
                playsinline
            >
                <source
                    src="/videos/sample.mp4"
                    type="video/mp4"
                >

                Your browser does not support HTML5 video.
            </video>
        </div>

        <p class="description">
            This video is served directly as a static asset by Vercel.
        </p>

        <div id="status" class="status">
            Checking application status…
        </div>
    </main>

    <script>
        async function checkHealth() {
            const status = document.getElementById("status");

            try {
                const response = await fetch("/api/health");

                if (!response.ok) {
                    throw new Error("Health check failed");
                }

                const data = await response.json();

                if (data.status === "ok") {
                    status.textContent = "Application is running.";
                    status.classList.add("ok");
                } else {
                    throw new Error("Unexpected response");
                }
            } catch (error) {
                status.textContent = "API is unavailable.";
                status.classList.add("error");
            }
        }

        checkHealth();
    </script>
</body>
</html>
